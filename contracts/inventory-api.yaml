    "/internal/reservations": {
      "post": {
        "operationId": "inventory_post__internal_reservations",
        "description": "Atomic reserve keyed by orderId/generation; no stock 409.",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            }
          },
          {
            "name": "traceparent",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^00-(?!0{32}-)[0-9a-f]{32}-(?!0{16}-)[0-9a-f]{16}-[0-9a-f]{2}$"
            }
          },
          {
            "name": "tracestate",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 512
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful result; duplicate mutations return original result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "common.schema.json#/$defs/Reservation"
                }
              }
            }
          },
          "400": {
            "description": "Standard error; see shared protocol.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "error.schema.json"
                }
              }
            }
          },

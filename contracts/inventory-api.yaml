              "application/json": {
                "schema": {
                  "$ref": "error.schema.json"
                }
              }
            }
          },
          "504": {
            "description": "Deadline exceeded; mutation outcome may be unknown.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "error.schema.json"
                }
              }
            }
          }
        },
        "x-access": "PROTECTED_AUTH_TBD",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "common.schema.json#/$defs/ReservationRequest"
              }

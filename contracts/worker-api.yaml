{
  "openapi": "3.1.0",
  "info": {
    "title": "AgentMesh worker API (PROPOSED)",
    "version": "0.1.0",
    "description": "Unapproved draft. Shared protocol: ../docs/contract-protocol.md. Authentication mechanism unresolved; absence of a security scheme is not permission for anonymous access."
  },
  "paths": {
    "/internal/failed-work/{orderId}": {
      "get": {
        "operationId": "worker_get__internal_failed_work__orderId_",
        "description": "Durable most recent failed generation/attempt metadata.",
        "parameters": [
          {
            "name": "orderId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "traceparent",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^00-(?!0{32}-)[0-9a-f]{32}-(?!0{16}-)[0-9a-f]{16}-[0-9a-f]{2}$"
            }
          },
          {
            "name": "tracestate",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 512
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful result; duplicate mutations return original result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "common.schema.json#/$defs/FailedWork"
                }
              }
            }
          },
          "400": {
            "description": "Standard error; see shared protocol.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "error.schema.json"
                }
              }
            }
          },
          "401": {
            "description": "Standard error; see shared protocol.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "error.schema.json"
                }
              }
            }
          },
          "403": {
            "description": "Standard error; see shared protocol.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "error.schema.json"
                }
              }
            }
          },
          "404": {
            "description": "Standard error; see shared protocol.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "error.schema.json"
                }
              }
            }
          },
          "409": {
            "description": "Idempotency payload conflict, stale generation/version or illegal transition.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "error.schema.json"
                }
              }
            }
          },
          "422": {
            "description": "Standard error; see shared protocol.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "error.schema.json"
                }
              }
            }
          },
          "502": {
            "description": "Standard error; see shared protocol.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "error.schema.json"
                }
              }
            }
          },
          "503": {
            "description": "Standard error; see shared protocol.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "error.schema.json"
                }
              }
            }
          },
          "504": {
            "description": "Deadline exceeded; mutation outcome may be unknown.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "error.schema.json"
                }
              }
            }
          }
        },
        "x-access": "PROTECTED_AUTH_TBD"
      }
    },

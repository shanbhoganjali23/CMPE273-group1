    "/orders": {
      "post": {
        "operationId": "order_post__orders",
        "description": "Create with client key. Same payload/key returns original acceptance.",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            }
          },
          {
            "name": "traceparent",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^00-(?!0{32}-)[0-9a-f]{32}-(?!0{16}-)[0-9a-f]{16}-[0-9a-f]{2}$"
            }
          },
          {
            "name": "tracestate",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 512
            }
          }
        ],
        "responses": {
          "202": {
            "description": "Successful result; duplicate mutations return original result.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "common.schema.json#/$defs/Order"
                }
              }
            }
          },
          "400": {
            "description": "Standard error; see shared protocol.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "error.schema.json"
                }
              }
            }
          },
          "401": {
            "description": "Standard error; see shared protocol.",
